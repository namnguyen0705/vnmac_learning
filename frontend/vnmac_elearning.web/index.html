<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VNMAC e-learning admin and learner portal" />
    <title>vnmac_elearning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const root = document.getElementById("root");

      import("/src/main.tsx").catch((cause) => {
        console.error("Failed to import /src/main.tsx", cause);

        if (!root) {
          return;
        }

        const detail =
          cause instanceof Error ? (cause.stack ?? cause.message) : "Khong tai duoc entry module.";

        root.innerHTML = `
          <div style="min-height:100vh;padding:40px;background:linear-gradient(180deg,#fff8f6 0%,#fff1ee 100%);font-family:'Segoe UI',Arial,sans-serif;color:#0f172a;">
            <div style="max-width:960px;margin:0 auto;border:1px solid #fecdd3;border-radius:28px;background:#fff;padding:24px;box-shadow:0 20px 60px rgba(15,23,42,0.08);">
              <p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#e11d48;">Frontend shell error</p>
              <h1 style="margin:0 0 12px;font-size:28px;font-weight:700;">Khong tai duoc entry module</h1>
              <pre style="margin:0;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;color:#334155;">${detail}</pre>
            </div>
          </div>
        `;
      });
    </script>
  </body>
</html>
