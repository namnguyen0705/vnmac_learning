<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCORM 2004 Demo</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f6f5f1; color: #2e3526; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
    .card { background: white; border: 1px solid #e5decd; border-radius: 18px; padding: 24px; box-shadow: 0 18px 48px rgba(41, 46, 28, 0.08); }
    h1 { margin-top: 0; font-size: 28px; }
    p { line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
      background: #8b6f0d; color: white; font-weight: 600;
    }
    button.secondary { background: #f5ecd2; color: #775f0d; }
    pre {
      white-space: pre-wrap; background: #1f1d16; color: #efe5bf; border-radius: 14px;
      padding: 16px; margin-top: 20px; min-height: 140px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>SCORM 2004 Demo Module</h1>
      <p>Module mẫu để kiểm tra completion status, success status, location và session time theo SCORM 2004.</p>
      <div class="actions">
        <button id="initBtn">Initialize</button>
        <button id="resumeBtn" class="secondary">Set Incomplete</button>
        <button id="completeBtn">Complete + Pass</button>
        <button id="terminateBtn" class="secondary">Terminate</button>
      </div>
      <pre id="log"></pre>
    </div>
  </main>
  <script>
    const api = window.parent.API_1484_11 || window.opener.API_1484_11;
    const log = document.getElementById('log');

    function write(message) {
      log.textContent += message + '\n';
    }

    document.getElementById('initBtn').addEventListener('click', function () {
      write('Initialize: ' + api.Initialize(''));
      write('learner: ' + api.GetValue('cmi.learner_name'));
      write('completion: ' + api.GetValue('cmi.completion_status'));
    });

    document.getElementById('resumeBtn').addEventListener('click', function () {
      write('Set location: ' + api.SetValue('cmi.location', 'topic-2'));
      write('Set completion: ' + api.SetValue('cmi.completion_status', 'incomplete'));
      write('Set session time: ' + api.SetValue('cmi.session_time', 'PT4M15S'));
      write('Commit: ' + api.Commit(''));
    });

    document.getElementById('completeBtn').addEventListener('click', function () {
      write('Set raw score: ' + api.SetValue('cmi.score.raw', '95'));
      write('Set completion: ' + api.SetValue('cmi.completion_status', 'completed'));
      write('Set success: ' + api.SetValue('cmi.success_status', 'passed'));
      write('Set suspend: ' + api.SetValue('cmi.suspend_data', 'completed'));
      write('Set session time: ' + api.SetValue('cmi.session_time', 'PT9M'));
      write('Commit: ' + api.Commit(''));
    });

    document.getElementById('terminateBtn').addEventListener('click', function () {
      write('Terminate: ' + api.Terminate(''));
    });
  </script>
</body>
</html>
