<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCORM 1.2 Demo</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f7f7; color: #17353c; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
    .card { background: white; border: 1px solid #d9e4e4; border-radius: 18px; padding: 24px; box-shadow: 0 18px 48px rgba(11, 48, 57, 0.08); }
    h1 { margin-top: 0; font-size: 28px; }
    p { line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
      background: #0d8a83; color: white; font-weight: 600;
    }
    button.secondary { background: #ecf6f5; color: #0d6f69; }
    pre {
      white-space: pre-wrap; background: #0f1f23; color: #cbe9e2; border-radius: 14px;
      padding: 16px; margin-top: 20px; min-height: 140px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>SCORM 1.2 Demo Module</h1>
      <p>Module mẫu để kiểm tra luồng LMS: initialize, set lesson status, commit, terminate.</p>
      <div class="actions">
        <button id="initBtn">Initialize</button>
        <button id="progressBtn" class="secondary">Set Incomplete</button>
        <button id="passBtn">Set Passed + Commit</button>
        <button id="finishBtn" class="secondary">Finish</button>
      </div>
      <pre id="log"></pre>
    </div>
  </main>
  <script>
    const api = window.parent.API || window.opener.API;
    const log = document.getElementById('log');

    function write(message) {
      log.textContent += message + '\n';
    }

    document.getElementById('initBtn').addEventListener('click', function () {
      write('LMSInitialize: ' + api.LMSInitialize(''));
      write('student: ' + api.LMSGetValue('cmi.core.student_name'));
      write('status: ' + api.LMSGetValue('cmi.core.lesson_status'));
    });

    document.getElementById('progressBtn').addEventListener('click', function () {
      write('Set location: ' + api.LMSSetValue('cmi.core.lesson_location', 'slide-2'));
      write('Set status incomplete: ' + api.LMSSetValue('cmi.core.lesson_status', 'incomplete'));
      write('Set session time: ' + api.LMSSetValue('cmi.core.session_time', '0000:03:30'));
      write('Commit: ' + api.LMSCommit(''));
    });

    document.getElementById('passBtn').addEventListener('click', function () {
      write('Set score raw: ' + api.LMSSetValue('cmi.core.score.raw', '100'));
      write('Set score min: ' + api.LMSSetValue('cmi.core.score.min', '0'));
      write('Set score max: ' + api.LMSSetValue('cmi.core.score.max', '100'));
      write('Set suspend: ' + api.LMSSetValue('cmi.suspend_data', 'done'));
      write('Set status passed: ' + api.LMSSetValue('cmi.core.lesson_status', 'passed'));
      write('Set session time: ' + api.LMSSetValue('cmi.core.session_time', '0000:07:00'));
      write('Commit: ' + api.LMSCommit(''));
    });

    document.getElementById('finishBtn').addEventListener('click', function () {
      write('LMSFinish: ' + api.LMSFinish(''));
    });
  </script>
</body>
</html>
